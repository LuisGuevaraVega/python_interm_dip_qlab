[project]
name = "tarea-2-ocr-asr"
version = "2026.2"
description = "Tarea 2 — Voces y documentos peruanos: OCR + ASR + extracción con LLM + dashboard"
requires-python = "==3.12.*"

# Entorno de trabajo de la tarea (notebooks). Basado en los grupos `docai` y `audio`
# del pyproject del curso; el dashboard usa su propio requirements.txt, mucho más ligero.
dependencies = [
  # Base
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "plotly>=5.24",
  "requests>=2.32",
  "tqdm>=4.67",
  "python-dotenv>=1.0",
  "huggingface-hub>=1.29.0",
  # Notebooks
  "ipykernel>=6.29",
  "ipywidgets>=8.1",
  "nbformat>=5.10",
  "nbclient>=0.10",
  # OCR (Sesión 10): PaddleOCR con PaddlePaddle o PyTorch (engine="transformers") + EasyOCR como alternativo
  "paddleocr>=3.7",
  "paddlepaddle>=3.2.1,<3.3",   # 3.3 en CPU/Windows falla con oneDNN (ConvertPirAttribute2RuntimeAttribute)
  "pillow>=10",
  "pymupdf>=1.24",
  "easyocr>=1.7.2",
  # ASR (Sesión 13): faster-whisper, Qwen3-ASR / Parakeet / MMS vía transformers, huellas de voz
  "torch>=2.8",
  "torchvision>=0.28.0",          # procesadores de imagen de PaddleOCR con engine="transformers"
  "transformers>=5.16",
  "accelerate>=1.10",
  "faster-whisper>=1.2.1",
  "pyannote-audio>=4.0.7",
  "soundfile>=0.13",
  "librosa>=0.11",
  "jiwer>=4.0",
  "rapidfuzz>=3.9",
  # Extracción estructurada con LLM
  "google-genai>=2.29.0",
  # Dashboard (para probarlo en local)
  "streamlit>=1.38",
  "kaleido==1.5.0",
]

[tool.uv]
# Igual que en el curso: PaddleX fija opencv-contrib-python==4.10.0.84 y las tres variantes de
# OpenCV comparten la carpeta cv2/; PyAV 19 rompe faster_whisper.decode_audio (1.2.1).
constraint-dependencies = ["opencv-python==4.10.0.84", "opencv-python-headless==4.10.0.84", "av<19"]
